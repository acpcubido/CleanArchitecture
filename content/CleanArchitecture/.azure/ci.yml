#
# See https://learn.microsoft.com/azure/devops/pipelines/yaml-schema for details on this file.
#

# Configure which branches trigger builds
trigger:
    branches:
        include:
            - main
            - release

pool:
    vmImage: "ubuntu-latest"

parameters:
    - name: ForceDeploySteps
      type: boolean
      default: false
    - name: azureSubscription
      type: string
      default: "Azure Connection"

variables:
    - group: "CI - Build"

stages:
    - stage: build
      displayName: Build
      dependsOn: []
      variables:
          buildConfiguration: "Release"
          solution: "Cubido.Template.slnx"
          # see https://learn.microsoft.com/en-us/nuget/reference/cli-reference/cli-ref-environment-variables
          NUGET_PACKAGES: $(Pipeline.Workspace)/.nuget/packages
      jobs:
          - job: changedFiles
            displayName: Changed Files
            steps:
                # see https://github.com/touchifyapp/vsts-changed-files/issues/44
                - checkout: self
                  fetchDepth: 0
                - task: ChangedFiles@2
                  name: CheckChanges
                  inputs:
                      ${{ if eq(variables['Build.Reason'], 'PullRequest') }}:
                          refBranch: "$(System.PullRequest.targetBranchName)"
                      rules: |
                          [HasFrontendChanges]
                          src/Frontend/**

                          [HasBackendChanges]
                          src/Application/**
                          src/Domain/**
                          src/Infrastructure/**
                          src/Web/**

                          [HasChangedPipeline]
                          .azure/ci.yml
                          deployment/**
          #if (IncludeFrontend)
          - job: buildFrontend
            displayName: Build Frontend
            dependsOn:
                - changedFiles
            condition: >
                or(
                  eq(variables['Build.SourceBranch'], 'refs/heads/main'),
                  eq(variables['Build.SourceBranch'], 'refs/heads/release'),
                  eq(dependencies.changedFiles.outputs['CheckChanges.HasFrontendChanges'], 'True'),
                  eq(dependencies.changedFiles.outputs['CheckChanges.HasChangedPipeline'], 'True')
                )
            variables:
                - group: "CI - Build"
            steps:
                - task: UseNode@1
                  displayName: "Setup Node.js 24"
                  inputs:
                      version: "24.19.0" # Use exactly this version to avoid issues with yarn PnP
                - task: CubidoSendProjectInfo@1
                  displayName: "Send Project Info to Cubido"
                  inputs:
                      apiIdentifier: "cubido-template-webapp"
                      filePath: "src/Frontend/package.json"
                - script: |
                      corepack enable
                      corepack prepare yarn@stable --activate
                  displayName: "Enable Corepack and setup Yarn"
                - script: |
                      cd src/Frontend
                      yarn install --immutable
                  displayName: "Install dependencies"
                  env:
                      TELERIK_LICENSE: $(KendoLicenseKey)
                - script: |
                      cd src/Frontend
                      yarn build
                  displayName: "Build frontend"
                - publish: src/Web/wwwroot
                  displayName: "Publish frontend artifacts"
                  artifact: frontend-dist
          #endif
          - job: buildBackend
            displayName: Build Backend
            dependsOn:
                - changedFiles
            condition: >
                or(
                  eq(variables['Build.SourceBranch'], 'refs/heads/main'),
                  eq(variables['Build.SourceBranch'], 'refs/heads/release'),
                  eq(dependencies.changedFiles.outputs['CheckChanges.HasBackendChanges'], 'True'),
                  eq(dependencies.changedFiles.outputs['CheckChanges.HasChangedPipeline'], 'True')
                )
            steps:
                - task: CubidoSendProjectInfo@1
                  displayName: "Send Project Info to Cubido"
                  inputs:
                      apiIdentifier: "cubido-template-webapp"
                      filePath: "Directory.Build.props"
                      dependenciesFilePath: "Directory.Packages.props"
                - task: Cache@2
                  displayName: Cache NuGet packages
                  inputs:
                      # see https://learn.microsoft.com/en-us/azure/devops/pipelines/artifacts/caching-nuget
                      key: 'nuget | "$(Agent.OS)" | **/packages.lock.json,!**/bin/**,!**/obj/**'
                      restoreKeys: |
                          nuget | "$(Agent.OS)"
                          nuget
                      path: $(NUGET_PACKAGES)
                - task: DotNetCoreCLI@2
                  displayName: "Restore NuGet packages"
                  inputs:
                      command: "restore"
                      projects: $(solution)
                      verbosityRestore: Minimal
                - task: DotNetCoreCLI@2
                  displayName: "dotnet build"
                  inputs:
                      command: "build"
                      arguments: "-c $(buildConfiguration) -p:GenerateDocumentationFile=true --no-restore"
                      projects: $(solution)
                - task: DotNetCoreCLI@2
                  displayName: "dotnet test"
                  inputs:
                      command: "test"
                      arguments: '--configuration $(buildConfiguration) --settings ci.runsettings --collect "Code coverage"'
                      projects: $(solution)
                  env:
                      USE_CONTAINER: "true"
          - ${{ if or(eq(parameters.ForceDeploySteps, true), eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq(variables['Build.SourceBranch'], 'refs/heads/release')) }}:
                - job: publishContainers
                  displayName: Publish Container Image
                  dependsOn:
                      - buildBackend
                      #if (IncludeFrontend)
                      - buildFrontend
                  #endif
                  condition: succeeded()
                  variables:
                      project: "src/Web/Web.csproj"
                  steps:
                      - checkout: self
                      - task: Cache@2
                        displayName: Cache NuGet packages
                        inputs:
                            key: 'nuget | "$(Agent.OS)" | **/packages.lock.json,!**/bin/**,!**/obj/**'
                            restoreKeys: |
                                nuget | "$(Agent.OS)"
                                nuget
                            path: $(NUGET_PACKAGES)
                      #if (IncludeFrontend)
                      - download: current
                        displayName: "Download frontend artifacts"
                        artifact: frontend-dist
                      - task: CopyFiles@2
                        displayName: "Copy frontend to wwwroot"
                        inputs:
                            SourceFolder: "$(Pipeline.Workspace)/frontend-dist"
                            Contents: "**"
                            TargetFolder: "src/Web/wwwroot"
                            CleanTargetFolder: true
                      #endif
                      - task: DotNetCoreCLI@2
                        displayName: "dotnet publish container"
                        inputs:
                            command: publish
                            projects: $(project)
                            arguments: "-c $(buildConfiguration) -r linux-x64 --self-contained false -p:PublishReadyToRun=true -p:PublishReadyToRunShowWarnings=true -p:SkipNSwag=True /t:PublishContainer -p:ContainerArchiveOutputPath=$(Build.ArtifactStagingDirectory)/app-web.tar.gz"
                            publishWebProjects: false
                            modifyOutputPath: false
                      - publish: $(Build.ArtifactStagingDirectory)/app-web.tar.gz
                        displayName: "Publish container app-web"
                        artifact: app-web

    - ${{ if or(eq(parameters.ForceDeploySteps, true), eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq(variables['Build.SourceBranch'], 'refs/heads/release')) }}:
          - stage: deployShared
            displayName: Deploy Shared Infrastructure
            dependsOn:
                - build
            condition: succeeded()
            jobs:
                - job: deploySharedACR
                  displayName: Deploy Shared ACR (if not exists)
                  steps:
                      - checkout: self
                      - task: AzureCLI@2
                        displayName: "Deploy Shared Container Registry"
                        inputs:
                            azureSubscription: $(azureSubscription)
                            scriptType: "bash"
                            scriptLocation: "inlineScript"
                            inlineScript: |
                                echo "Checking if shared ACR exists..."
                                ACR_EXISTS=$(az acr list --resource-group "rg-cubido-template-shared" --query "[0].name" -o tsv 2>/dev/null || echo "")

                                if [ -z "$ACR_EXISTS" ]; then
                                  echo "Shared ACR not found. Deploying..."
                                  az deployment group create \
                                    --resource-group "rg-cubido-template-shared" \
                                    --template-file deployment/main-shared.bicep \
                                    --parameters @deployment/parameters-shared.json \
                                    --name "shared-acr-$(Build.BuildId)"
                                else
                                  echo "Shared ACR already exists: $ACR_EXISTS"
                                fi

                                # Get ACR name for use in later stages
                                ACR_NAME=$(az acr list --resource-group "rg-cubido-template-shared" --query "[0].name" -o tsv)
                                echo "##vso[task.setvariable variable=sharedAcrName;isOutput=true]$ACR_NAME"
                        name: sharedInfra

          - stage: deployDev
            displayName: Deploy to Development
            dependsOn:
                - build
                - deployShared
            condition: succeeded()
            variables:
                sharedAcrName: $[ stageDependencies.deployShared.deploySharedACR.outputs['sharedInfra.sharedAcrName'] ]
            jobs:
                - deployment: deployToDev
                  displayName: Deploy to Development Environment
                  environment: "Development"
                  strategy:
                      runOnce:
                          deploy:
                              steps:
                                  - template: deploy.yml
                                    parameters:
                                        resourceGroup: "rg-cubido-template-dev"
                                        parametersFile: "parameters-dev.json"
                                        imageTag: "dev"
                                        sharedAcrName: "$(sharedAcrName)"

          - stage: deployTest
            displayName: Deploy to Testing
            dependsOn:
                - build
                - deployShared
            condition: succeeded()
            variables:
                sharedAcrName: $[ stageDependencies.deployShared.deploySharedACR.outputs['sharedInfra.sharedAcrName'] ]
            jobs:
                - deployment: deployToTest
                  displayName: Deploy to Test Environment
                  environment: "Testing"
                  strategy:
                      runOnce:
                          deploy:
                              steps:
                                  - template: deploy.yml
                                    parameters:
                                        resourceGroup: "rg-cubido-template-test"
                                        parametersFile: "parameters-test.json"
                                        imageTag: "test"
                                        sharedAcrName: "$(sharedAcrName)"

          - stage: deployProd
            displayName: Deploy to Production
            dependsOn:
                - build
                - deployShared
            condition: succeeded()
            variables:
                sharedAcrName: $[ stageDependencies.deployShared.deploySharedACR.outputs['sharedInfra.sharedAcrName'] ]
            jobs:
                - deployment: deployToProd
                  displayName: Deploy to Production Environment
                  environment: "Production"
                  strategy:
                      runOnce:
                          deploy:
                              steps:
                                  - template: deploy.yml
                                    parameters:
                                        resourceGroup: "rg-cubido-template-prod"
                                        parametersFile: "parameters-prod.json"
                                        imageTag: "prod"
                                        sharedAcrName: "$(sharedAcrName)"
