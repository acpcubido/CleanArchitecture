#
# Deployment template for Cubido.Template
# This template is used to deploy infrastructure and web application to Azure
#

parameters:
    - name: resourceGroup
      type: string
    - name: parametersFile
      type: string
    - name: imageTag
      type: string
      default: "latest"
    - name: sharedAcrName
      type: string
      default: ""
    - name: azureSubscription
      type: string
      default: "Azure Connection"

steps:
    - checkout: self
      displayName: "Checkout source code"

    - download: current
      artifact: app-web
      displayName: "Download App Container Artifact"

    - task: AzureCLI@2
      displayName: "Push Container to Shared ACR"
      inputs:
          azureSubscription: ${{ parameters.azureSubscription }}
          scriptType: "bash"
          scriptLocation: "inlineScript"
          inlineScript: |
              # Get the shared ACR name (from parameter or lookup)
              if [ -n "${{ parameters.sharedAcrName }}" ]; then
                ACR_NAME="${{ parameters.sharedAcrName }}"
              else
                ACR_NAME=$(az acr list --resource-group "rg-cubido-template-shared" --query "[0].name" -o tsv)
              fi

              echo "Logging into shared ACR: $ACR_NAME"
              az acr login --name $ACR_NAME

              ACR_LOGIN_SERVER="$ACR_NAME.azurecr.io"
              BUILD_ID="$(Build.BuildId)"
              ENV_TAG="${{ parameters.imageTag }}"

              # Process App Web container
              echo "Loading app-web container image from artifact"
              docker load --input $(Pipeline.Workspace)/app-web/app-web.tar.gz

              IMAGE_ID=$(docker images --format "{{.Repository}}:{{.Tag}}" | head -n 1)
              echo "Loaded app-web image: $IMAGE_ID"

              BUILD_ID_IMAGE="$ACR_LOGIN_SERVER/app-web:$BUILD_ID"
              ENV_IMAGE="$ACR_LOGIN_SERVER/app-web:$ENV_TAG"

              echo "Tagging app-web image as: $BUILD_ID_IMAGE"
              echo "Tagging app-web image as: $ENV_IMAGE"
              docker tag $IMAGE_ID $BUILD_ID_IMAGE
              docker tag $IMAGE_ID $ENV_IMAGE

              echo "Pushing app-web images to ACR"
              docker push $BUILD_ID_IMAGE
              docker push $ENV_IMAGE

              echo "Container image pushed successfully"

    - task: AzureCLI@2
      displayName: "Deploy Infrastructure and Container App"
      inputs:
          azureSubscription: ${{ parameters.azureSubscription }}
          scriptType: "bash"
          scriptLocation: "inlineScript"
          inlineScript: |
              echo "Deploying Bicep file"
              cd deployment

              BUILD_ID="$(Build.BuildId)"
              echo "Deploying with image tag: $BUILD_ID"

              # Get ACR name if not provided
              if [ -n "${{ parameters.sharedAcrName }}" ]; then
                ACR_NAME="${{ parameters.sharedAcrName }}"
              else
                ACR_NAME=$(az acr list --resource-group "rg-cubido-template-shared" --query "[0].name" -o tsv)
              fi

              set -e  # Exit on any error

              az deployment group create \
                --resource-group "${{ parameters.resourceGroup }}" \
                --template-file main.bicep \
                --parameters @${{ parameters.parametersFile }} \
                --parameters imageTag=$BUILD_ID \
                --parameters sharedAcrName=$ACR_NAME \
                --mode Incremental \
                --verbose

              if [ $? -ne 0 ]; then
                echo "##vso[task.logissue type=error]Deployment failed"
                exit 1
              fi

              echo "Container Apps deployed with image tag: $BUILD_ID"

    - task: AzureCLI@2
      displayName: "Get Container App URLs"
      inputs:
          azureSubscription: ${{ parameters.azureSubscription }}
          scriptType: "bash"
          scriptLocation: "inlineScript"
          inlineScript: |
              # Get environment name from deployment
              ENV_NAME=$(az deployment group show \
                --resource-group "${{ parameters.resourceGroup }}" \
                --name "main" \
                --query "properties.parameters.environment.value" -o tsv)

              echo "Environment: $ENV_NAME"

              # Get App app URL
              APP_FQDN=$(az containerapp show \
                --name "app-$ENV_NAME" \
                --resource-group "${{ parameters.resourceGroup }}" \
                --query "properties.configuration.ingress.fqdn" \
                -o tsv)

              echo "App Container App URL: https://$APP_FQDN"
              echo "##vso[task.setvariable variable=appUrl]https://$APP_FQDN"

    - script: |
          echo "Pinging App health endpoint: $(appUrl)/health"
          HTTP_CODE=$(curl -sS -o /dev/null -w "%{http_code}" "$(appUrl)/health")
          echo "App HTTP Status Code: $HTTP_CODE"
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "App health check passed"
          else
            echo "##vso[task.logissue type=error]App health check failed with status code: $HTTP_CODE"
            exit 1
          fi
      displayName: "Health check App"
